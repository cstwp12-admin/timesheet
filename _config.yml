# Timesheet docs site — "Site Tools" Jekyll theme, shared by the WPN apps (in this repository, no gem needed).
# GitHub Pages builds the .md files (README, GUIDE, CHANGELOG …) into pages with this theme.
# index.html (the app) has no front matter, so Jekyll copies it unchanged.
#
# There must be NO .nojekyll file in the repository, or GitHub skips the theme.

title: Timesheet
tagline: Monthly project timesheets, from phone to HQ
description: Key in the month on your phone, print the official timesheet for signature, keep the signed scan and compile the team's copies into one PDF for HQ. Developed by WPN.
developer: WPN
app_url: ./              # where "Open the app" goes (the app is index.html in this folder)
app_icon: icon-192.png
icon_type: image/png
accent: "#C8420D"        # buttons and links; same orange as the app
hero_images:             # pictures beside the title on the home page (wide screens)
  - guide/03_filled.png
  - guide/20_hq_cover.png
nav:
  - { title: Guide, url: GUIDE.html }
  - { title: What's new, url: CHANGELOG.html }
  - { title: Roadmap, url: ROADMAP.html }
  - { title: About, url: README.html }
footer_links:
  - { title: Licence, url: LICENSE.html }
  - { title: Third-party notices, url: THIRD-PARTY-NOTICES.html }

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

# all of these come with GitHub Pages and are on by default; listed so the intent is clear
plugins:
  - jekyll-optional-front-matter   # .md files without front matter become pages
  - jekyll-relative-links          # [Guide](GUIDE.md) links become GUIDE.html
  - jekyll-titles-from-headings    # page title = first heading
  - jekyll-default-layout
relative_links:
  enabled: true
readme_index:          # keep README a normal page: the folder's home page is the app (index.html)
  enabled: false
optional_front_matter:
  remove_originals: true
include:               # GitHub skips files named README and LICENSE unless they are listed here
  - README.md
  - LICENSE.md

defaults:
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - tests/
  - tools/
  - test-out/
  - "*.py"
  - Gemfile
  - Gemfile.lock
  - vendor/
